name: Verify ICT-SMC lite

on:
  push:
    branches:
      - ict-smc-lite
    paths:
      - ".github/workflows/verify-ict-smc-lite.yml"
      - "scripts/kb_retrieve.py"
      - "knowledge_base/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ict-smc-lite
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile retriever
        run: python -m py_compile scripts/kb_retrieve.py scripts/prune_to_ict_smc.py
      - name: Verify schools and counts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          allowed={"ICT","SMC"}
          concepts=list(Path("knowledge_base/concepts").glob("*.json"))
          cases=list(Path("knowledge_base/cases").glob("*.json"))
          assert len(concepts)==346, len(concepts)
          assert len(cases)==904, len(cases)
          for p in concepts+cases:
              card=json.loads(p.read_text(encoding="utf-8"))
              assert card.get("school") in allowed, (p, card.get("school"))
          print("cards ok", len(concepts), len(cases))
          PY
      - name: Smoke-test retrieval
        run: |
          python scripts/kb_retrieve.py "Fair Value Gap" --type concept --top-k 3 --format json > /tmp/fvg.json
          python scripts/kb_retrieve.py "liquidity sweep ES NQ" --type case --top-k 3 --format json > /tmp/cases.json
          python - <<'PY'
          import json
          for p in ("/tmp/fvg.json","/tmp/cases.json"):
              data=json.load(open(p, encoding="utf-8"))
              assert data["count"] > 0, p
          print("retrieval smoke tests ok")
          PY
