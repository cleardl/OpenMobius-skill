name: Prune to ICT-SMC lite

on:
  push:
    branches:
      - ict-smc-lite
    paths:
      - ".github/workflows/prune-ict-smc-lite.yml"
      - "scripts/prune_to_ict_smc.py"

permissions:
  contents: write

jobs:
  prune:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ict-smc-lite
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prune repository
        run: python scripts/prune_to_ict_smc.py

      - name: Commit pruned tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "refactor: keep only ICT/SMC knowledge core"
          git push origin HEAD:ict-smc-lite
